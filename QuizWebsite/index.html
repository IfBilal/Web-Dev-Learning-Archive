<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Quiz</h1>
    </header>
    <div id="quiz-wrapper">
        <h2 class="timer">Time Left: </h2>
      <div id="quiz-box">
        <h2 class="question-no"></h2>
        <h3 id="question"></h3>
        <form>
          <div id="answer"></div>
          <button class="submit" type="submit">Submit</button>
        </form>
        <p id="answer-type"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
